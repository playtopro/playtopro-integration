name: build-and-release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Custom card
        run: |
          npm ci
          npm run build
        shell: bash

      # 1. Modify the file locally inside the runner workspace (uncommitted)
      - name: Rewrite manifest.json for release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg ver "$VERSION" '.version = $ver' custom_components/playtopro/manifest.json > manifest.release.json
          mv manifest.release.json custom_components/playtopro/manifest.json
        shell: bash

      - name: Rewrite const.py JS module version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" custom_components/playtopro/const.py
        shell: bash

      - name: Rewrite package.json version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg ver "$VERSION" '.version = $ver' package.json > package.release.json
          mv package.release.json package.json
        shell: bash

      # 2. Safety check to make sure your custom card asset exists
      - name: Verify card exists
        run: |
          test -f custom_components/playtopro/frontend/playtopro-card.js
          ls -la custom_components/playtopro/frontend/
          echo "✅ Found playtopro-card.js in tagged commit"

      # 3. Zip the contents from INSIDE custom_components/playtopro
      - name: Archive production artifacts
        run: |
          cd custom_components/playtopro
          zip -r ../../playtopro.zip ./*
        shell: bash

      # 4. Upload your production artifacts directly to the GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            playtopro.zip
            custom_components/playtopro/frontend/playtopro-card.js
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
